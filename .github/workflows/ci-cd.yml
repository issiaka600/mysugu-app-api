name: CI-CD MySugu API — build & deploy

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

concurrency:
  group: mysugu-backend-deploy
  # Never cancel a run mid-deploy: it can leave the server between the jar swap and
  # the health gate. `timeout-minutes` below already bounds a stuck deployment.
  cancel-in-progress: false

env:
  SSH_HOST: 66.29.139.117
  SSH_USER: root
  REMOTE_DIR: /root/mysugu

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev          # deploy secrets (DEPLOY_SSH_KEY, ...) live in the "dev" environment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar (skip tests)
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: Locate built jar
        id: jar
        run: |
          JAR=$(ls target/*.jar | grep -vE 'original|sources|javadoc' | head -1)
          test -n "$JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Check deploy host is reachable
        run: |
          set -euo pipefail
          # A dead host and a throttling sshd fail very differently, and only one of
          # them is worth retrying. Without this probe an offline VPS walks the whole
          # backoff ladder below and then blames "SSH connections being refused".
          for attempt in 1 2 3 4 5 6; do
            if timeout 10 bash -c "cat < /dev/null > /dev/tcp/$SSH_HOST/22" 2>/dev/null; then
              echo "$SSH_HOST:22 is reachable (attempt $attempt)."
              exit 0
            fi
            echo "::warning::$SSH_HOST:22 did not answer (attempt $attempt/6)"
            sleep 10
          done
          echo "::error::$SSH_HOST:22 is unreachable — the deploy host is down or firewalled off, this is not a CI failure. Check the VPS from the hosting provider's console before re-running this workflow."
          exit 1

      - name: Load deploy key
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY }}   # base64 (single line) of the OpenSSH private key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          if [ -z "${DEPLOY_SSH_KEY_B64:-}" ]; then
            echo "::error::secrets.DEPLOY_SSH_KEY is empty — check it exists in the 'dev' environment and the job declares 'environment: dev'"
            exit 1
          fi

          if ! printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key 2>/tmp/base64.err; then
            echo "::error::secrets.DEPLOY_SSH_KEY is not valid base64 ($(cat /tmp/base64.err)) — regenerate it with: base64 -w0 < deploy_key"
            exit 1
          fi
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            echo "::error::the decoded DEPLOY_SSH_KEY is not a usable OpenSSH private key"
            exit 1
          fi
          echo "Deploy key loaded."

          # Best effort only: the host's sshd resets a large share of incoming
          # connections, so this must not kill the job. `-t ed25519` keeps it to a
          # single TCP connection (the default scans 5 key types = 5 connections,
          # which is enough on its own to trip the server's connection throttle).
          # The scp/ssh steps below use StrictHostKeyChecking=accept-new, so a failed
          # scan costs us host-key pinning, not the deployment.
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -t ed25519 -H "$SSH_HOST" >> ~/.ssh/known_hosts && [ -s ~/.ssh/known_hosts ]; then
              echo "known_hosts populated for $SSH_HOST (attempt $attempt)."
              break
            fi
            echo "::warning::ssh-keyscan could not reach $SSH_HOST (attempt $attempt/3)"
            sleep 5
          done

          # Let any connection throttle triggered by the scan expire before the
          # deployment steps open their own connection.
          sleep 5

      - name: Ship jar + deploy script
        run: |
          set -euo pipefail
          # The host's sshd resets a large share of incoming connections
          # ("kex_exchange_identification: Connection reset by peer"), so a single
          # attempt fails often. Retry the handshake, then keep ONE connection open
          # (ControlMaster) and let the second scp and the deploy step below ride it
          # instead of opening new ones.
          SSH_OPTS="-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o ConnectTimeout=30 \
                    -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
                    -o ControlMaster=auto -o ControlPath=$HOME/.ssh/cm-%r@%h:%p -o ControlPersist=15m"

          retry() {
            local label="$1"; shift
            local delay=5 rc=0
            for attempt in 1 2 3 4 5 6; do
              rc=0; "$@" || rc=$?
              [ "$rc" -eq 0 ] && { echo "$label: OK (attempt $attempt)"; return 0; }
              if [ "$attempt" -eq 6 ]; then
                echo "::error::$label failed after 6 attempts (last exit $rc) — port 22 answered but the SSH session kept dropping (sshd throttling, or the host died mid-deploy)"
                return "$rc"
              fi
              echo "::warning::$label failed (exit $rc), retrying in ${delay}s (attempt $attempt/6)"
              sleep "$delay"
              delay=$(( delay * 2 < 60 ? delay * 2 : 60 ))
            done
          }

          retry "ship jar" scp $SSH_OPTS -i ~/.ssh/deploy_key "${{ steps.jar.outputs.path }}" "$SSH_USER@$SSH_HOST:$REMOTE_DIR/backend/mysugu-app-api.jar.new"
          retry "ship deploy script" scp $SSH_OPTS -i ~/.ssh/deploy_key ci/deploy-backend.sh "$SSH_USER@$SSH_HOST:$REMOTE_DIR/deploy-backend.sh"

      - name: Deploy (backup → swap → rebuild → health-gate → rollback)
        run: |
          set -euo pipefail
          # Reuses the connection opened by the step above (ControlPath), so this
          # does not pay for another handshake against a throttling sshd. Deliberately
          # NOT retried: the deploy swaps a jar on the server and is not idempotent.
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o ConnectTimeout=30 \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ControlMaster=auto -o ControlPath=$HOME/.ssh/cm-%r@%h:%p -o ControlPersist=15m \
            -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "bash $REMOTE_DIR/deploy-backend.sh"
