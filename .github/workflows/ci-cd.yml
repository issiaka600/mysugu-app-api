name: CI-CD MySugu API — build & deploy

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

concurrency:
  group: mysugu-backend-deploy
  cancel-in-progress: false

env:
  SSH_HOST: 66.29.139.117
  SSH_USER: root
  REMOTE_DIR: /root/mysugu

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jar (skip tests)
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: Locate built jar
        id: jar
        run: |
          JAR=$(ls target/*.jar | grep -vE 'original|sources|javadoc' | head -1)
          test -n "$JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Load deploy key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # DEPLOY_SSH_KEY is the base64 (single line) of the OpenSSH private key
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null   # fail fast if the key is malformed
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship jar + deploy script
        run: |
          scp -i ~/.ssh/deploy_key "${{ steps.jar.outputs.path }}" "$SSH_USER@$SSH_HOST:$REMOTE_DIR/backend/mysugu-app-api.jar.new"
          scp -i ~/.ssh/deploy_key ci/deploy-backend.sh "$SSH_USER@$SSH_HOST:$REMOTE_DIR/deploy-backend.sh"

      - name: Deploy (backup → swap → rebuild → health-gate → rollback)
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "bash $REMOTE_DIR/deploy-backend.sh"
