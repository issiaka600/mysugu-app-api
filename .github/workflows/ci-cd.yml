name: CI-CD MySugu API

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # ✅ Nom exact du package GHCR vu dans ton repo (Packages -> mysuguapp-api)
  IMAGE_NAME: mysuguapp-api
  CONTAINER_NAME: mysugu-app-api
  APP_PORT: "8083"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build JAR (skip tests)
        run: ./mvnw -B clean package -DskipTests

      # ✅ Login GHCR seulement sur push (pas sur PR)
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # ✅ On construit l'image sur: ghcr.io/<owner>/mysuguapp-api
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,format=short
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (and Push on push)
        uses: docker/build-push-action@v6
        with:
          context: .
          # PR => build sans push ; Push sur dev => push
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    environment: dev
    steps:
      - name: Deploy on server (docker pull + run)
        uses: appleboy/ssh-action@v1.2.5
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: FIREBASE_SA_JSON
          script: |
            set -e
            IMAGE="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:dev"
            NAME="${{ env.CONTAINER_NAME }}"
            ENV_FILE="${{ secrets.DEPLOY_ENV_FILE }}"
            PORT="${{ env.APP_PORT }}"
            SECRETS_DIR="/root/mysuguapp/secrets"

            # Écriture automatique du service account Firebase
            mkdir -p "$SECRETS_DIR"
            echo "$FIREBASE_SA_JSON" > "$SECRETS_DIR/firebase-service-account.json"
            chmod 600 "$SECRETS_DIR/firebase-service-account.json"

            echo "Deploying $IMAGE"
            # Login GHCR (image privée)
            if [ -n "${{ secrets.GHCR_USERNAME }}" ] && [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            fi
            docker pull "$IMAGE"
            docker rm -f "$NAME" || true
            docker run -d \
              --name "$NAME" \
              --restart unless-stopped \
              --env-file "$ENV_FILE" \
              -p ${PORT}:${PORT} \
              -v "$SECRETS_DIR:/root/mysuguapp/secrets:ro" \
              "$IMAGE"