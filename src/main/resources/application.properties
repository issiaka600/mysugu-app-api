spring.config.import=optional:file:.env[.properties]
spring.application.name=MySuguClientApp
server.port=8083

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

#POSTGRESQL DB CONFIGURATION
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


#MAIL CONFIGURATION
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.default-encoding=UTF-8
# Optional for debugging with logs SMTP
#spring.mail.properties.mail.debug=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Tomcat 11 limite a 10 parts par requete multipart par defaut; les formulaires
# admin (restaurant: ~11 champs + logo) depassent cette limite
server.tomcat.max-part-count=30

# Configuration MinIO
minio.endpoint=${MINIO_ENDPOINT}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=mysugu

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

# Google Authentication
google.auth.client-id=${GOOGLE_AUTH_CLIENT_ID:}
google.auth.client-ids=${GOOGLE_AUTH_CLIENT_IDS:}
google.auth.token-info-url=https://oauth2.googleapis.com/tokeninfo
google.auth.token-info-urls=${GOOGLE_AUTH_TOKEN_INFO_URLS:}

# Apple Sign In (bundle id / Services ID)
apple.auth.client-id=${APPLE_AUTH_CLIENT_ID:ma.mysuku.customer}

# Public base URL used to build frontend/mobile-friendly file URLs
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8083}

# Frontend URL for email links
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}

# Refresh token expiration (30 days)
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# Firebase Cloud Messaging (FCM) Push Notifications
# Mettre firebase.enabled=true et fournir le chemin vers le fichier service account JSON de Firebase
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

# Alerte d'une nouvelle commande au vendeur : envoi immédiat, puis répétition jusqu'à décision.
order.seller-alert.interval-seconds=${ORDER_SELLER_ALERT_INTERVAL_SECONDS:20}
order.seller-alert.duration-seconds=${ORDER_SELLER_ALERT_DURATION_SECONDS:120}
order.seller-alert.poll-delay-ms=${ORDER_SELLER_ALERT_POLL_DELAY_MS:5000}

# Attribution séquentielle : une offre réservée au livreur le plus proche, puis expiration/refus -> suivant.
delivery.offer.duration-seconds=${DELIVERY_OFFER_DURATION_SECONDS:30}
delivery.offer.alert-interval-seconds=${DELIVERY_OFFER_ALERT_INTERVAL_SECONDS:20}
delivery.offer.poll-delay-ms=${DELIVERY_OFFER_POLL_DELAY_MS:5000}
delivery.dispatch.retry-delay-ms=${DELIVERY_DISPATCH_RETRY_DELAY_MS:15000}
delivery.driver-location.max-age-seconds=${DELIVERY_DRIVER_LOCATION_MAX_AGE_SECONDS:120}

# Stripe Payment Gateway
# Mettre stripe.enabled=true et fournir les clés API Stripe
stripe.enabled=${STRIPE_ENABLED:false}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=${STRIPE_CURRENCY:mad}
# TikTak/Laravel server-to-server integration
tiktak.integration.enabled=${TIKTAK_INTEGRATION_ENABLED:false}
tiktak.integration.base-url=${TIKTAK_INTEGRATION_BASE_URL:https://dashboard.atlantique21service.one}
tiktak.integration.token=${TIKTAK_INTEGRATION_TOKEN:}
# Format: mysukuId:tiktakId,mysukuId:tiktakId
tiktak.integration.restaurant-seller-map=${TIKTAK_RESTAURANT_SELLER_MAP:}
tiktak.integration.plat-product-map=${TIKTAK_PLAT_PRODUCT_MAP:}
# Format for status callbacks: tiktakDeliveryManId:mysukuLivreurId
tiktak.integration.delivery-man-map=${TIKTAK_DELIVERY_MAN_MAP:}
tiktak.integration.identity-fallback=${TIKTAK_IDENTITY_FALLBACK:true}

# Test data bootstrap
test.data.enabled=${TEST_DATA_ENABLED:false}
