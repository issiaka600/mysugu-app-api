# Configuration de test isolée — n'importe PAS le .env de production.
# Base Postgres jetable locale (conteneur mysugu-test-db sur :5433).
spring.config.import=
spring.application.name=MySuguClientApp-test

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/mysugu_test
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT (pas de valeur par défaut côté app → obligatoire)
jwt.secret=test-secret-0123456789-0123456789-0123456789-0123456789-0123456789
jwt.expiration=86400000

# Intégrations externes neutralisées pour les tests
firebase.enabled=false
stripe.enabled=false
minio.endpoint=http://127.0.0.1:9999
minio.access-key=test
minio.secret-key=testtest1234
minio.bucket-name=test
app.public-base-url=http://localhost:8083
app.frontend.url=http://localhost:8090

# Mail : aucun envoi réel en test (les tests qui déclenchent un email mockent EmailService)
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@localhost
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=false

google.auth.client-id=
google.auth.client-ids=
google.auth.token-info-urls=
apple.auth.client-id=ma.mysuku.customer
